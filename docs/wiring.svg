<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<style>
  .t   { font-family:"Segoe UI",system-ui,sans-serif; }
  .h1  { font-size:26px; font-weight:700; fill:#1a202c; }
  .sub { font-size:15px; fill:#4a5568; }
  .box { fill:#fff; stroke:#2d3748; stroke-width:2; rx:8; }
  .soft{ fill:#f7fafc; stroke:#cbd5e0; stroke-width:1.5; rx:6; }
  .ttl { font-size:15px; font-weight:700; fill:#1a202c; }
  .lbl { font-size:12.5px; fill:#4a5568; }
  .pin { font-size:11.5px; fill:#718096; font-family:Consolas,monospace; }
  .wire{ stroke-width:3; fill:none; }
  .cap { font-size:12.5px; font-weight:600; }
  .note{ font-size:12px; fill:#718096; }
  .foot{ font-size:11.5px; fill:#a0aec0; }
</style>
<g class="t">
<text x="600" y="42" text-anchor="middle" class="h1">Spaghetti Watchdog — wiring</text>
<text x="600" y="68" text-anchor="middle" class="sub">Three physical connections. Everything else is network.</text>

<!-- UNO Q -->
<rect x="430" y="120" width="340" height="120" class="box"/>
<text x="600" y="150" text-anchor="middle" class="ttl">Arduino UNO Q</text>
<text x="600" y="172" text-anchor="middle" class="lbl">Qualcomm QRB2210 (Linux) + STM32U585 (MCU)</text>
<rect x="455" y="188" width="130" height="34" class="soft"/>
<text x="520" y="210" text-anchor="middle" class="pin">USB-C  5 V</text>
<rect x="615" y="188" width="130" height="34" class="soft"/>
<text x="680" y="210" text-anchor="middle" class="pin">8x13 LED matrix</text>

<!-- Stacking -->
<line x1="600" y1="240" x2="600" y2="292" class="wire" stroke="#2d3748"/>
<text x="614" y="270" class="cap" fill="#2d3748">stacked</text>
<text x="614" y="286" class="note">JMEDIA / JMISC headers, no cable</text>

<!-- Carrier -->
<rect x="430" y="292" width="340" height="104" class="box"/>
<text x="600" y="322" text-anchor="middle" class="ttl">UNO Media Carrier (ASX00083)</text>
<text x="600" y="343" text-anchor="middle" class="lbl">sits underneath — it provides the CSI ports</text>
<rect x="500" y="356" width="200" height="30" class="soft"/>
<text x="600" y="376" text-anchor="middle" class="pin">CAM0 — 22-pin CSI</text>

<!-- Camera -->
<rect x="80" y="292" width="250" height="104" class="box"/>
<text x="205" y="322" text-anchor="middle" class="ttl">Arducam NoIR 8 MP</text>
<text x="205" y="343" text-anchor="middle" class="lbl">IMX219 sensor, fixed focus</text>
<rect x="120" y="356" width="170" height="30" class="soft"/>
<text x="205" y="376" text-anchor="middle" class="pin">15-pin CSI</text>
<line x1="330" y1="371" x2="500" y2="371" class="wire" stroke="#dd6b20"/>
<text x="415" y="360" text-anchor="middle" class="cap" fill="#dd6b20">CSI ribbon</text>
<text x="205" y="418" text-anchor="middle" class="note">15-to-22 pin ribbon, max 30 cm</text>

<!-- Power -->
<rect x="870" y="150" width="250" height="66" class="box"/>
<text x="995" y="176" text-anchor="middle" class="ttl">USB-C power supply</text>
<text x="995" y="197" text-anchor="middle" class="lbl">5 V — the only supply in the build</text>
<line x1="770" y1="205" x2="870" y2="185" class="wire" stroke="#c53030"/>
<text x="820" y="228" text-anchor="middle" class="cap" fill="#c53030">USB-C</text>

<!-- Network -->
<rect x="430" y="470" width="340" height="60" class="soft"/>
<text x="600" y="497" text-anchor="middle" class="ttl">Wi-Fi — your LAN</text>
<text x="600" y="517" text-anchor="middle" class="lbl">on-board radio, nothing plugged in</text>
<line x1="600" y1="396" x2="600" y2="470" class="wire" stroke="#3182ce"/>

<rect x="80" y="600" width="420" height="96" class="box"/>
<text x="290" y="628" text-anchor="middle" class="ttl">3D printer — Klipper + Moonraker</text>
<text x="290" y="650" text-anchor="middle" class="lbl">Elegoo Neptune 4 Plus, stock firmware</text>
<text x="290" y="674" text-anchor="middle" class="pin">HTTP :80  (not 7125 — nginx sits in front)</text>
<line x1="520" y1="530" x2="330" y2="600" class="wire" stroke="#3182ce"/>
<text x="352" y="546" text-anchor="end" class="cap" fill="#3182ce">read state · pause</text>

<rect x="700" y="600" width="420" height="96" class="box"/>
<text x="910" y="628" text-anchor="middle" class="ttl">Home Assistant + Mosquitto</text>
<text x="910" y="650" text-anchor="middle" class="lbl">four entities appear via MQTT discovery</text>
<text x="910" y="674" text-anchor="middle" class="pin">MQTT :1883</text>
<line x1="680" y1="530" x2="870" y2="600" class="wire" stroke="#3182ce"/>
<text x="848" y="546" class="cap" fill="#3182ce">publish</text>

<rect x="80" y="726" width="1040" height="42" rx="8" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1.5"/>
<text x="600" y="753" text-anchor="middle" class="cap" fill="#276749">No breadboard, no resistors, no soldering — the LED matrix is on the UNO Q itself.</text>

<text x="1120" y="800" text-anchor="end" class="foot">raspberry.tips · Spaghetti Watchdog · 2026 · CC BY 4.0</text>
</g></svg>
