name: Spaghetti-Watchdog
description: Detects failed 3D prints (spaghetti) with a FOMO-AD visual anomaly model, reports to Home Assistant over MQTT discovery, can pause the printer through Moonraker and raises a local alarm on the LED matrix.
icon: 🍝
ports: []
bricks:
  - arduino:web_ui:      # status web page (log + image) on port 7000
  - arduino:visual_anomaly_detection:
      # Folder name under /home/arduino/.arduino-bricks/models/custom-ei/
      #
      # This is the BUILT-IN example model, on purpose. App Lab refuses to
      # start the app without a registered model, so a fresh install would be
      # stuck: you need images to train a model, but the app that collects
      # them will not start without one. This placeholder breaks that loop.
      # Once your own model is trained, copy the .eim to
      # /home/arduino/.arduino-bricks/ei-models/, add a model.yaml, and put
      # its name here.
      model: concrete-crack-anomaly-detection
